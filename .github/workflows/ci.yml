# DAFTECH CRM — Continuous Integration
#
# Runs on every push and pull request. Builds both the .NET backend and the
# Angular frontend, runs whatever automated tests exist, and runs an OWASP
# ZAP baseline scan against a locally-started instance of the API.
#
# NOTE ON REPO LAYOUT: this workflow assumes the monorepo root contains
# `api/DaftechCrm` (the .NET solution) and `ng/daftech-crm` (the Angular
# app), matching the paths used elsewhere in this project.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "20.x"
  API_SOLUTION: api/DaftechCrm/DaftechCrm.sln
  FRONTEND_DIR: ng/daftech-crm

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.API_SOLUTION }}"

      - name: Build (Release)
        run: dotnet build "${{ env.API_SOLUTION }}" --configuration Release --no-restore

      - name: Test
        run: |
          if find api/DaftechCrm -iname "*Tests.csproj" -o -iname "*.Tests.csproj" | grep -q .; then
            dotnet test "${{ env.API_SOLUTION }}" --configuration Release --no-build \
              --logger "trx;LogFileName=test-results.trx" \
              --collect:"XPlat Code Coverage"
          else
            echo "No backend test projects found yet — skipping. Add a *.Tests.csproj project to enable this step."
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore

      - name: Publish (build-only sanity check)
        run: dotnet publish api/DaftechCrm/src/DaftechCrm.Api/DaftechCrm.Api.csproj -c Release -o /tmp/api-publish --no-restore

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Unit tests
        run: |
          if npm run | grep -qE "^\s*test\b"; then
            npm test -- --watch=false --browsers=ChromeHeadless
          else
            echo "No 'test' script defined in package.json yet — skipping."
          fi

      - name: Build (staging configuration)
        run: npx ng build --configuration staging

  # NOTE: this job also requires at least one EF Core migration to be
  # committed under src/DaftechCrm.Infrastructure/Migrations (see README
  # step 2 — `dotnet ef migrations add InitialCreate`). The repo ships with
  # that folder empty on purpose, so until a migration is committed,
  # `dotnet ef database update` below is a no-op, the app has no schema to
  # query, and this job will still fail its health check. That's a
  # pre-existing gap (this job had no database service at all before), not
  # something introduced by the JWT changes — flagging it here so it isn't
  # missed.
  security-scan:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: daftech_crm
          POSTGRES_USER: daftech
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U daftech -d daftech_crm"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Restore
        run: dotnet restore "${{ env.API_SOLUTION }}"

      - name: Apply migrations
        working-directory: api/DaftechCrm/src/DaftechCrm.Api
        env:
          ConnectionStrings__Postgres: "Host=127.0.0.1;Port=5432;Database=daftech_crm;Username=daftech;Password=ci_password"
        run: dotnet ef database update --project ../DaftechCrm.Infrastructure --startup-project .

      - name: Start API in background (Development, in-memory-friendly config)
        env:
          ConnectionStrings__Postgres: "Host=127.0.0.1;Port=5432;Database=daftech_crm;Username=daftech;Password=ci_password"
          # CI-only signing key — never used outside this ephemeral scan run.
          Jwt__SigningKey: "ci-only-signing-key-do-not-use-in-any-real-environment-32bytes+"
        run: |
          dotnet restore "${{ env.API_SOLUTION }}"
          nohup dotnet run --project api/DaftechCrm/src/DaftechCrm.Api \
            --configuration Release --urls http://localhost:8080 \
            > api.log 2>&1 &
          echo $! > api.pid

      - name: Wait for API to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/live >/dev/null 2>&1; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          cat api.log || true
          exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:8080"
          cmd_options: "-a"
          fail_action: false # report findings without failing the build; tighten once triaged

      - name: Stop API
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true
