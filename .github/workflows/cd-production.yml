# DAFTECH CRM — Continuous Deployment (Production)
#
# Triggers on every push to `main`. Same pipeline as staging, plus:
#   - a GitHub Environment approval gate (configure "production" environment
#     with required reviewers in repo settings)
#   - a database backup taken immediately before migrations run
#   - deployment through the reverse-proxy compose overlay (docker-compose.prod.yml)
#
# NOTE ON REPO LAYOUT: this repo (daftech-backend) has the .NET solution and
# docker/scripts folders at its root. The Angular frontend lives in its own
# repo (daftech-frontend) with its own deploy pipeline (Netlify) — this
# workflow only builds and deploys the API.
#
# Required repository secrets:
#   PROD_HOST, PROD_SSH_USER, PROD_SSH_KEY
#   PROD_DB_HOST, PROD_DB_USER, PROD_DB_PASSWORD
#   REGISTRY, REGISTRY_USERNAME, REGISTRY_PASSWORD

name: CD - Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  IMAGE_API: ${{ vars.REGISTRY || 'ghcr.io' }}/${{ github.repository }}/api

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=prod-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY || 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backup-database:
    name: Backup production database
    runs-on: ubuntu-latest
    needs: [build-and-push]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run backup over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/daftech-crm
            DB_HOST=${{ secrets.PROD_DB_HOST }} \
            DB_USER=${{ secrets.PROD_DB_USER }} \
            DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }} \
            DB_NAME=daftech_crm \
            scripts/backup-database.sh

  migrate-database:
    name: Apply EF Core migrations
    runs-on: ubuntu-latest
    needs: [backup-database]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Run migrations against production database
        env:
          DB_HOST: ${{ secrets.PROD_DB_HOST }}
          DB_USER: ${{ secrets.PROD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          DB_NAME: daftech_crm
        run: |
          chmod +x scripts/migration-run.sh
          scripts/migration-run.sh

  deploy:
    name: Deploy to production host
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate-database]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/daftech-crm
            export IMAGE_TAG=${{ needs.build-and-push.outputs.tag }}
            docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml \
              --env-file docker/.env.production pull
            docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml \
              --env-file docker/.env.production up -d --remove-orphans
            docker image prune -f

      - name: Verify production health
        run: |
          for i in $(seq 1 15); do
            if curl -fsS "https://crm.daftech.et/health/ready" >/dev/null 2>&1; then
              echo "Production is healthy"
              exit 0
            fi
            sleep 4
          done
          echo "Production did not report healthy after deploy"
          exit 1

      - name: Roll back on failed health check
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/daftech-crm
            echo "Health check failed — rolling back to previous 'latest' images"
            docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml \
              --env-file docker/.env.production up -d --remove-orphans