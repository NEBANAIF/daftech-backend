# DAFTECH CRM — Continuous Deployment (Production)
#
# Render builds and deploys the API directly from this GitHub repo's
# Dockerfile on every push to `main` — that part is NOT done here, it's
# configured on Render's side (Settings -> Build & Deploy -> Auto-Deploy: Yes).
#
# This workflow only handles the two things Render doesn't do for you:
#   1. Take a backup of the Neon production database before schema changes land
#   2. Apply pending EF Core migrations directly against Neon
# ...then waits for Render's own (independent, parallel) deploy to report
# healthy.
#
# Required repository secrets:
#   NEON_DATABASE_URL_PROD — Npgsql connection string for the production
#     Neon database, e.g.:
#     Host=<project>.neon.tech;Port=5432;Database=daftech_crm;
#     Username=<user>;Password=<password>;Ssl Mode=Require;Trust Server Certificate=true
#
# No SSH host, no registry, no PROD_HOST secrets needed — Neon is reachable
# over the public internet, and Render pulls straight from GitHub.

name: CD - Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  PROD_URL: "https://daftechb.onrender.com"

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  backup-database:
    name: Backup production database
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump production database
        env:
          NEON_DATABASE_URL_PROD: ${{ secrets.NEON_DATABASE_URL_PROD }}
        run: |
          mkdir -p backups
          # Neon backups are also covered by its own point-in-time restore,
          # this is a belt-and-suspenders extra copy kept as a workflow artifact.
          pg_dump "$NEON_DATABASE_URL_PROD" --format=custom --file="backups/daftech_crm_$(date +%Y%m%dT%H%M%S).dump"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.sha }}
          path: backups/*.dump
          retention-days: 30

  migrate-database:
    name: Apply EF Core migrations
    runs-on: ubuntu-latest
    needs: [backup-database]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Run migrations against Neon
        env:
          ConnectionStrings__Postgres: ${{ secrets.NEON_DATABASE_URL_PROD }}
        run: |
          dotnet ef database update \
            --project src/DaftechCrm.Infrastructure \
            --startup-project src/DaftechCrm.Api

  verify-deployment:
    name: Verify Render deployment health
    runs-on: ubuntu-latest
    needs: [migrate-database]
    steps:
      - name: Wait for Render to build & deploy, then check health
        run: |
          # Render's own build+deploy runs independently of this workflow and
          # can take a few minutes, so this just polls until it's up.
          for i in $(seq 1 40); do
            if curl -fsS "${{ env.PROD_URL }}/health/ready" >/dev/null 2>&1; then
              echo "Production is healthy"
              exit 0
            fi
            sleep 15
          done
          echo "Production did not report healthy within the expected window"
          exit 1