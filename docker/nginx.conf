# DAFTECH CRM — reverse proxy (production)
#
# Terminates TLS, serves the Angular build directly, and proxies /api to
# the backend container (this includes authenticated document downloads at
# /api/agreements/{id}/document — there is no separate static /files route).
# Used by docker-compose.prod.yml, mounted read-only into the `nginx` service.
#
# Expects certs mounted at /etc/nginx/certs/fullchain.pem and privkey.pem
# (e.g. from certbot / Let's Encrypt) — see docker-compose.prod.yml.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Redirect all plain HTTP to HTTPS.
    server {
        listen 80;
        server_name crm.daftech.et www.crm.daftech.et;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name crm.daftech.et www.crm.daftech.et;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS is also set by the API for API responses; set it here too so it
        # applies to the static frontend responses served directly by nginx.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        client_max_body_size 12M; # a little above the API's 10MB upload limit

        # ---- Angular static files ----
        root /usr/share/nginx/html;
        index index.html;

        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ---- Backend API ----
        location /api/ {
            proxy_pass http://api:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploaded agreement documents are no longer served as static files —
        # they go through the authenticated /api/agreements/{id}/document
        # controller action (see location /api/ above), which enforces
        # [Authorize] and per-client ownership checks that a raw file proxy
        # can't apply.

        # ---- Health checks (used by uptime monitors, not container healthchecks) ----
        location /health {
            proxy_pass http://api:8080/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ---- Angular client-side routing fallback ----
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
